    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in sandbox iFrame environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('@vite/client') || e.message?.includes('createWebSocketModuleRunnerTransport') || String(e.filename).includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client') || String(e.reason).includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
